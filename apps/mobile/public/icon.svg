<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FabXpert Time">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2c2920"/>
      <stop offset="1" stop-color="#131210"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="130" x2="0" y2="382" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4ca70"/>
      <stop offset="0.5" stop-color="#dca948"/>
      <stop offset="1" stop-color="#bf862c"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#sheen)"/>

  <!-- White F, gold X. Same geometry as before, only the F changed colour. -->
  <g transform="translate(256,256) scale(0.9) translate(-256,-256)">
    <g transform="translate(-30,0)">
      <g fill="#ffffff">
        <rect x="120" y="138" width="54" height="236" rx="5"/>
        <rect x="120" y="138" width="134" height="54" rx="5"/>
        <rect x="120" y="230" width="116" height="52" rx="5"/>
      </g>
      <g stroke="url(#gold)" stroke-width="54" stroke-linecap="butt">
        <line x1="292" y1="138" x2="430" y2="374"/>
        <line x1="430" y1="138" x2="292" y2="374"/>
      </g>
    </g>
  </g>

  <!-- Clock badge: "time tracking". The dark disc keeps it off the X. -->
  <circle cx="390" cy="390" r="82" fill="#131210"/>
  <circle cx="390" cy="390" r="68" fill="url(#gold)"/>
  <g stroke="#2b2107" stroke-width="11" stroke-linecap="round" fill="none">
    <circle cx="390" cy="390" r="37"/>
    <path d="M390 366 V392 H412"/>
  </g>
</svg>
